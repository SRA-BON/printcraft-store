<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline • Rong-Tuli</title>
    <meta name="theme-color" content="#111827" />
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e5e7eb; }
        .card { background: #1f2937; border-color: #374151; }
        .muted { color: #9ca3af; }
        .btn { background: #2563eb; color: #fff; }
      }
      .card {
        max-width: 32rem;
        padding: 2rem;
        border-radius: 1rem;
        border: 1px solid #e5e7eb;
        background: #ffffff;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        text-align: center;
      }
      h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
      .muted { font-size: 0.9rem; color: #6b7280; }
      .btn {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        background: #3b82f6;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card" role="status" aria-live="polite">
      <h1>You're Offline</h1>
      <p class="muted">Some features aren’t available without a network connection. Please reconnect and try again.</p>
      <a class="btn" href="/">Go Home</a>
    </div>
  </body>
  </html>
